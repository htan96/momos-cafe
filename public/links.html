<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b615c" />
    <meta
      name="description"
      content="Find Momo's Cafe Vallejo: view the menu, get directions, and follow us on Instagram."
    />
    <meta property="og:title" content="Momo's Cafe Vallejo" />
    <meta property="og:description" content="Menu, directions, and the latest from Momo's Cafe." />
    <meta property="og:image" content="https://momosvallejo.com/images/og-image.png" />
    <meta property="og:url" content="https://momosvallejo.com/links" />
    <title>Momo's Cafe | Menu, Directions &amp; Social</title>
    <link rel="icon" href="/images/icon.png" />
    <style>
      :root {
        color-scheme: light;
        --cream: #fbf2df;
        --paper: #fffaf0;
        --teal: #0b615c;
        --teal-deep: #073f3c;
        --red: #b92e2b;
        --gold: #e4aa2d;
        --ink: #292a26;
        --muted: #68655e;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 12% 8%, rgba(228, 170, 45, 0.2), transparent 26rem),
          linear-gradient(155deg, #fff8e9 0%, var(--cream) 54%, #eee1c7 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.38;
        background-image: radial-gradient(rgba(7, 63, 60, 0.16) 0.65px, transparent 0.65px);
        background-size: 7px 7px;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 620px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(7, 63, 60, 0.16);
        border-radius: 30px;
        background: rgba(255, 250, 240, 0.96);
        box-shadow: 0 24px 70px rgba(47, 43, 32, 0.18);
      }

      .photo {
        position: relative;
        min-height: 195px;
        background: var(--teal-deep) url("/images/menu/breakfast-burrito.jpg") center 57% / cover no-repeat;
      }

      .photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(7, 63, 60, 0.08) 20%, rgba(7, 63, 60, 0.82) 100%);
      }

      .location-pill {
        position: absolute;
        z-index: 1;
        left: 18px;
        bottom: 16px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 11px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        color: white;
        background: rgba(7, 63, 60, 0.72);
        backdrop-filter: blur(8px);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .content {
        padding: 0 22px 24px;
        text-align: center;
      }

      .logo-wrap {
        width: 116px;
        height: 116px;
        margin: -58px auto 10px;
        position: relative;
        z-index: 2;
        display: grid;
        place-items: center;
        border: 5px solid var(--paper);
        border-radius: 50%;
        background: var(--paper);
        box-shadow: 0 10px 28px rgba(25, 54, 49, 0.2);
      }

      .logo-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
      }

      h1 {
        margin: 0;
        color: var(--teal-deep);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(30px, 9vw, 42px);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .tagline {
        margin: 10px auto 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .links {
        display: grid;
        gap: 11px;
      }

      .link {
        min-height: 66px;
        padding: 10px 15px;
        display: grid;
        grid-template-columns: 44px 1fr 24px;
        align-items: center;
        gap: 10px;
        border: 2px solid transparent;
        border-radius: 17px;
        color: white;
        text-decoration: none;
        text-align: left;
        box-shadow: 0 8px 18px rgba(7, 63, 60, 0.13);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      .link:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(7, 63, 60, 0.18);
        filter: saturate(1.08);
      }

      .link:active { transform: translateY(0) scale(0.985); }

      .link:focus-visible {
        outline: 4px solid rgba(228, 170, 45, 0.55);
        outline-offset: 3px;
      }

      .link.menu { background: var(--red); }
      .link.directions { background: var(--teal); }
      .link.instagram {
        color: var(--teal-deep);
        border-color: rgba(11, 97, 92, 0.2);
        background: #f3dfaf;
      }

      .icon-box {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.16);
      }

      .instagram .icon-box { background: rgba(11, 97, 92, 0.1); }
      .icon-box svg, .arrow { width: 22px; height: 22px; }

      .link-copy { min-width: 0; }

      .link-title {
        display: block;
        font-size: 16px;
        font-weight: 800;
        line-height: 1.2;
      }

      .link-detail {
        display: block;
        margin-top: 3px;
        opacity: 0.78;
        font-size: 12px;
        font-weight: 550;
        line-height: 1.25;
      }

      .arrow { opacity: 0.72; }

      .hours {
        margin: 19px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .hours strong { color: var(--teal-deep); }

      .footer {
        margin: 18px 0 0;
        color: rgba(41, 42, 38, 0.58);
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 380px) {
        main { padding-inline: 12px; }
        .content { padding-inline: 16px; }
        .photo { min-height: 178px; }
        .logo-wrap { width: 104px; height: 104px; margin-top: -52px; }
      }

      @media (min-width: 700px) {
        main { padding-block: 42px; }
        .photo { min-height: 230px; }
        .content { padding-inline: 34px; padding-bottom: 30px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .link { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="photo" role="img" aria-label="A fresh breakfast burrito from Momo's Cafe">
          <span class="location-pill">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            Vallejo, California
          </span>
        </div>

        <div class="content">
          <div class="logo-wrap">
            <img src="/images/logo.png" width="256" height="256" alt="Momo's Cafe logo" />
          </div>

          <h1 id="page-title">Momo's Cafe</h1>
          <p class="tagline">Big breakfast. Bold flavor. Bay Area soul.</p>

          <nav class="links" aria-label="Momo's Cafe links">
            <a class="link menu" href="/menu">
              <span class="icon-box">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h13a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V3Z"/><path d="M8 7h7M8 11h7M8 15h4"/></svg>
              </span>
              <span class="link-copy">
                <span class="link-title">View the Menu</span>
                <span class="link-detail">Breakfast, lunch &amp; house favorites</span>
              </span>
              <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a class="link directions" href="https://www.google.com/maps/place/1922+Broadway+St,+Vallejo,+CA+94589" target="_blank" rel="noopener noreferrer">
              <span class="icon-box">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              </span>
              <span class="link-copy">
                <span class="link-title">Get Directions</span>
                <span class="link-detail">1922 Broadway St, Vallejo</span>
              </span>
              <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m9 18 6-6-6-6"/></svg>
            </a>

            <a class="link instagram" href="https://instagram.com/momoscafe" target="_blank" rel="noopener noreferrer">
              <span class="icon-box">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
              </span>
              <span class="link-copy">
                <span class="link-title">Follow on Instagram</span>
                <span class="link-detail">@momoscafe</span>
              </span>
              <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m9 18 6-6-6-6"/></svg>
            </a>
          </nav>

          <p class="hours"><strong>Open daily, 8 AM - 4 PM</strong><br />Serving inside Morgen's Kitchen</p>
        </div>
      </section>

      <p class="footer">Momo's Cafe &bull; Vallejo &bull; Est. 2000</p>
    </main>
  </body>
</html>
